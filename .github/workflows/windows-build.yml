name: Windows Build

on:
  push:
    branches:
      - win
  pull_request:
    branches:
      - win
  workflow_dispatch:
    inputs:
      publish_release:
        description: Create or update the GitHub Release after the Windows build succeeds
        required: false
        type: boolean
        default: false
      release_tag:
        description: Optional explicit release tag, for example v2.5.0-win.1
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: windows-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows-build:
    if: >-
      github.event_name == 'pull_request' ||
      github.event_name == 'workflow_dispatch' ||
      (
        github.event_name == 'push' &&
        github.ref == 'refs/heads/win' &&
        (
          startsWith(github.event.head_commit.message, 'release:') ||
          contains(github.event.head_commit.message, '[release]') ||
          contains(github.event.head_commit.message, '[win-release]')
        )
      )
    # Electron/node-gyp 10.x does not recognize VS 2026 yet.
    # Pin VS 2022 until the native rebuild toolchain supports VS 18.
    runs-on: windows-2022

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Decide whether to run the Windows release flow
        id: release_gate
        shell: pwsh
        run: |
          $shouldRelease = 'false'
          $reason = 'build only'
          $message = git log -1 --pretty=%B
          $manualPublish = '${{ github.event.inputs.publish_release }}'

          if ($env:GITHUB_EVENT_NAME -eq 'pull_request') {
            $reason = 'pull request validation'
          } elseif ($env:GITHUB_EVENT_NAME -eq 'workflow_dispatch') {
            if ($manualPublish -eq 'true') {
              $shouldRelease = 'true'
              $reason = 'manual workflow_dispatch requested release publishing'
            } else {
              $reason = 'manual workflow_dispatch build only'
            }
          } elseif ($env:GITHUB_EVENT_NAME -eq 'push' -and $env:GITHUB_REF -eq 'refs/heads/win') {
            if ($message -match '(?im)^\s*release:' -or $message -match '\[(win-)?release\]') {
              $shouldRelease = 'true'
              $reason = 'win branch push contains an explicit release marker'
            }
          }

          "should_release=$shouldRelease" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "reason=$reason" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "Windows release flow gate: release=$shouldRelease ($reason)"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Set up just
        uses: extractions/setup-just@v4

      - name: Install dependencies
        run: npm ci

      - name: Prepare GitHub Release metadata
        id: release_meta
        if: steps.release_gate.outputs.should_release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $pkg = Get-Content package.json -Raw | ConvertFrom-Json
          $version = [string]$pkg.version
          $baseVersion = $version -replace '-win\.\d+$', ''
          $manualTag = '${{ github.event.inputs.release_tag }}'.Trim()

          if ($manualTag) {
            $tag = if ($manualTag.StartsWith('v')) { $manualTag } else { "v$manualTag" }
            if ($tag -notmatch '^v\d+\.\d+\.\d+-win\.[1-9]\d*$') {
              throw "Windows release_tag must look like vX.Y.Z-win.N, got '$manualTag'."
            }
          } else {
            $escapedVersion = [regex]::Escape($baseVersion)
            $maxWinPatch = 0
            $releases = gh release list --limit 100 --json tagName | ConvertFrom-Json
            foreach ($release in @($releases)) {
              $match = [regex]::Match([string]$release.tagName, "^v$escapedVersion-win\.(\d+)$")
              if ($match.Success) {
                $maxWinPatch = [Math]::Max($maxWinPatch, [int]$match.Groups[1].Value)
              }
            }
            $refs = gh api "repos/$env:GITHUB_REPOSITORY/git/matching-refs/tags/v$version-win." | ConvertFrom-Json
            foreach ($ref in @($refs)) {
              $match = [regex]::Match([string]$ref.ref, "^refs/tags/v$escapedVersion-win\.(\d+)$")
              if ($match.Success) {
                $maxWinPatch = [Math]::Max($maxWinPatch, [int]$match.Groups[1].Value)
              }
            }
            $tag = "v$baseVersion-win.$($maxWinPatch + 1)"
          }
          $packageVersion = $tag -replace '^v', ''

          $title = "$tag Windows"
          $notes = "Windows release built from ``$env:GITHUB_SHA`` on the ``win`` branch."
          if (Test-Path CHANGELOG.md) {
            $changelog = Get-Content CHANGELOG.md -Raw
            $escapedVersion = [regex]::Escape($baseVersion)
            $match = [regex]::Match($changelog, "(?ms)^## \[$escapedVersion\].*?(?=^## \[|\z)")
            if ($match.Success) {
              $notes = $match.Value.Trim()
            }
          }
          $notes += "`n`nBuild run: https://github.com/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"
          Set-Content -Path release-notes.md -Value $notes -Encoding utf8

          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "package_version=$packageVersion" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "title=$title" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "Prepared release $tag"

      - name: Stamp Windows package version
        if: steps.release_gate.outputs.should_release == 'true'
        shell: pwsh
        run: |
          $pkg = Get-Content package.json -Raw | ConvertFrom-Json
          $pkg.version = '${{ steps.release_meta.outputs.package_version }}'
          $json = $pkg | ConvertTo-Json -Depth 20
          Set-Content -Path package.json -Value ($json + "`n") -Encoding utf8
          "Stamped package.json version $($pkg.version)"

      - name: Build Windows artifacts
        run: just ci

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: fanbox-windows-${{ github.sha }}
          path: |
            dist/*.exe
            dist/*.zip
          if-no-files-found: error

      - name: Publish GitHub Release
        if: steps.release_gate.outputs.should_release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $tag = '${{ steps.release_meta.outputs.tag }}'
          $title = '${{ steps.release_meta.outputs.title }}'
          $assets = @(Get-ChildItem dist -File | Where-Object { $_.Extension -in '.exe', '.zip' })
          if ($assets.Count -eq 0) {
            throw 'No Windows release assets found in dist/.'
          }
          $assetPaths = @($assets | ForEach-Object { $_.FullName })

          $releaseExists = $true
          gh release view $tag *> $null
          if ($LASTEXITCODE -ne 0) {
            $releaseExists = $false
          }

          if ($releaseExists) {
            gh release edit $tag --title $title --notes-file release-notes.md --target $env:GITHUB_SHA
            gh release upload $tag @assetPaths --clobber
          } else {
            gh release create $tag @assetPaths --target $env:GITHUB_SHA --title $title --notes-file release-notes.md
          }
