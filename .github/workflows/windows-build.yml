name: Windows Build

on:
  push:
    branches:
      - win
  pull_request:
    branches:
      - win
  workflow_dispatch:

jobs:
  windows-build:
    # Electron/node-gyp 10.x does not recognize VS 2026 yet.
    # Pin VS 2022 until the native rebuild toolchain supports VS 18.
    runs-on: windows-2022

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Set up just
        uses: extractions/setup-just@v4

      - name: Install dependencies
        run: npm ci

      - name: Build Windows artifacts
        run: just ci

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: fanbox-windows-${{ github.sha }}
          path: |
            dist/*.exe
            dist/*.zip
          if-no-files-found: error
